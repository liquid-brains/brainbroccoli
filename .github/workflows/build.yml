name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Android
        if: matrix.platform == 'android'
        run: make apk
      - name: Build unsigned iOS app
        if: matrix.platform == 'ios'
        run: make ipa
      - name: Package desktop app
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: npm run package:desktop
      - name: Archive Linux app
        if: matrix.platform == 'linux'
        run: tar -czf BrainBroccoli-linux.tar.gz -C dist-desktop BrainBroccoli-linux-x64
      - name: Archive Windows app
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path dist-desktop/BrainBroccoli-win32-x64 -DestinationPath BrainBroccoli-windows.zip
      - name: Archive macOS app
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent dist-desktop/BrainBroccoli-darwin-arm64/BrainBroccoli.app BrainBroccoli-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: brainbroccoli-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            .xcode-derived-data/Build/Products/Release-iphoneos/BrainBroccoli.app
            BrainBroccoli-*.tar.gz
            BrainBroccoli-*.zip
