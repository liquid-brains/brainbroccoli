name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses
          for attempt in 1 2 3; do
            if "$sdkmanager" --verbose \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "ndk;27.1.12297006" \
              "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK installation failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Android SDK installation failed on attempt $attempt; retrying."
            sleep "$((attempt * 10))"
          done
      - name: Install ccache
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache
      - name: Restore build caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules
            .gradle
            .ccache
            .xcode-derived-data
            ios
            ~/.cache/electron
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ matrix.platform }}-build-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-build-
      - name: Build Android
        if: matrix.platform == 'android'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
        run: make BUILD_TARGET=apk
      - name: Build unsigned iOS app
        if: matrix.platform == 'ios'
        run: make BUILD_TARGET=ipa
      - name: Package desktop app
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package:desktop
      - name: Archive Linux app
        if: matrix.platform == 'linux'
        run: tar -czf BrainBroccoli-linux.tar.gz -C dist-desktop BrainBroccoli-linux-x64
      - name: Archive Windows app
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path dist-desktop/BrainBroccoli-win32-x64 -DestinationPath BrainBroccoli-windows.zip
      - name: Archive macOS app
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent dist-desktop/BrainBroccoli-darwin-arm64/BrainBroccoli.app BrainBroccoli-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: brainbroccoli-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            .xcode-derived-data/Build/Products/Release-iphoneos/BrainBroccoli.app
            BrainBroccoli-*.tar.gz
            BrainBroccoli-*.zip
